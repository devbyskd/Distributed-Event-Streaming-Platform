[package]
name = "distributed-event-streaming-platform"
version = "0.1.0"
edition = "2021"
description = "A high-throughput, distributed message broker built in Rust."

[dependencies]
tokio = { version = "1.32.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.4.0"
tracing = "0.1"
tracing-subscriber = "0.3"
